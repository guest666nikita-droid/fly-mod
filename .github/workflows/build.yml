on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install tools
        run: |
          cargo install cargo-ndk
          HOST="github.com"
          REPO="Rayan-XOO/horizon"
          git clone --depth 1 --branch android-port "https://${HOST}/${REPO}.git" /tmp/horizon-cli
          cargo install --path /tmp/horizon-cli/crates/horizon-mod-cli
      - name: Build .hnmod
        run: |
          cargo horizon-mod new fly --template native
          cp lib.rs fly/src/lib.rs
          cp horizon-native.json fly/horizon-native.json || true
          cd fly
          cargo horizon-mod android
      - uses: actions/upload-artifact@v4
        with:
          name: fly-hnmod
          path: "**/*.hnmod"
